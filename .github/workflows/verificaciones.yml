# PENDIENTE: no puede descargar los datos desde GitHub (403 del portal); ver decisión sobre una copia CC BY.
# Ejecuta el análisis completo en un equipo limpio: descarga los datos oficiales,
# instala las versiones exactas de renv.lock y falla si alguna de las 98
# verificaciones de 05_verificaciones.R no coincide con survey.
name: verificaciones

on:
  workflow_dispatch:   # solo manual: el portal de datos abiertos bloquea (403) las IP de los servidores de GitHub
jobs:
  analisis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.5.3"
          use-public-rspm: true

      - uses: r-lib/actions/setup-renv@v2

      - name: Análisis completo y verificaciones
        run: Rscript R/99_run_all.R

      - name: Resultados
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultados
          path: outputs/
