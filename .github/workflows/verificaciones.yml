# Ejecuta el análisis completo en un equipo limpio: descarga los datos oficiales,
# instala las versiones exactas de renv.lock y falla si alguna de las 98
# verificaciones de 05_verificaciones.R no coincide con survey.
name: verificaciones

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 12 1 * *"   # el día 1 de cada mes

jobs:
  analisis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.5.3"
          use-public-rspm: true

      - uses: r-lib/actions/setup-renv@v2

      - name: Análisis completo y verificaciones
        run: Rscript R/99_run_all.R

      - name: Resultados
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultados
          path: outputs/
